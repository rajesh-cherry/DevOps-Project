# Requires Prometheus Operator (for example, kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: employee-api
  namespace: devops
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: employee-api
  namespaceSelector:
    matchNames:
      - devops
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
